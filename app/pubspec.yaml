name: retinova
description: Triagem de retinopatia diabética por celular, com IA offline que sabe quando não tem certeza.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.0.7
  url_launcher: ^6.2.5
  sqflite: ^2.3.3
  path: ^1.9.0
  connectivity_plus: ^6.0.3
  # Inferência do modelo no aparelho
  tflite_flutter: ^0.12.1
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/retinova_float32.tflite
